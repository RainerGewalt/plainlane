name: plainlane

services:
  app:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DB_PATH: /data/plainlane.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      PLAINLANE_AUTO_BACKUP: ${PLAINLANE_AUTO_BACKUP:-1}
    volumes:
      - plainlane-data:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PLAINLANE_BIND_ADDRESS:-127.0.0.1}:${PLAINLANE_PORT:-8080}:80"

volumes:
  plainlane-data:
